<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-teal-500 selection:text-white">
  <div id="root"></div>
  
  <!-- PWA Service Worker Registration with Auto-Update & Cache Busting -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          reg.update().catch(() => {});
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
                  console.log('New version of Result Analyzer activated, refreshing...');
                  window.location.reload();
                }
              });
            }
          });
        }).catch((err) => {
          console.warn('SW registration:', err);
        });
      });
    }
  </script>
</body>
