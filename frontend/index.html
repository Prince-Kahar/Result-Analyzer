<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VNSGU - Student Result Analyzer | SASCMA</title>
  
  <!-- Favicon & PWA Metadata -->
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="apple-touch-icon" href="/assets/logo.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Result Analyzer" />
    <!-- Desktop Windows & Edge PWA Support -->
  <meta name="application-name" content="Result Analyzer" />
  <meta name="msapplication-TileColor" content="#0d9488" />
  <meta name="msapplication-TileImage" content="/assets/logo.png" />
  <meta name="msapplication-navbutton-color" content="#0d9488" />
  <meta name="msapplication-starturl" content="/" />
  <meta name="description" content="Veer Narmad South Gujarat University Academic Result Intelligence & Merit Analytics Suite" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#0d9488',
            secondary: '#0284c7',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-teal-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  
  <!-- PWA Service Worker Registration with Auto-Update & Cache Busting -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          reg.update().catch(() => {});
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
                  console.log('New version of Result Analyzer activated, refreshing...');
                  window.location.reload();
                }
              });
            }
          });
        }).catch((err) => {
          console.warn('SW registration:', err);
        });
      });
    }
  </script>
</body>
</html>
